server:
  port: "8080"
  mode: "debug"

mongo:
  uri: "mongodb://mongo:27017"
  database: "wuxie"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

jwt:
  secret: "wuxie-jwt-secret-change-in-production"  # 生产环境必须修改为至少32字符的随机字符串
  expires: 72

wx:
  app_id: "your-wx-app-id"
  secret: "your-wx-app-secret"
  template_id: "your-subscribe-template-id"
  remind_hour: 20

media_url: "http://media-server:8081"
media_secret: "wuxie-media-secret-change-in-production"

cors:
  allowed_origins:
    - "http://localhost:8080"
    - "http://localhost:3000"
    - "http://localhost"
    # 生产环境添加实际域名，如:
    # - "https://wuxie.example.com"

admin:
  username: "admin"
  password: "change-me-in-production"
